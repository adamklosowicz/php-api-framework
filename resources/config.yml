debug: true

routes:
  - name: getAllUsers
    method: GET
    path: /users
    controller: ExampleApp\Controllers\ExampleController
    action: index
    queryParams:
      - name: name
        required: true
        type: string
      - name: age
        required: false
        type: int
        min: 0
        max: 99

  - name: getUser
    method: GET
    path: /users/{id}
    controller: ExampleApp\Controllers\ExampleController
    action: show